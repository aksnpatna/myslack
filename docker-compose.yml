services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/config.yaml
    network_mode: host          # required for WebRTC UDP NAT traversal
    volumes:
      - ./server/livekit.yaml:/etc/livekit/config.yaml:ro
    restart: unless-stopped
    env_file:
      - .env
    # UDP 50000-60000 are opened via host networking; expose signal port explicitly
    # ports are implicit when using host networking — listed here for documentation:
    # - "7880:7880"   # HTTP/WS signal
    # - "7881:7881"   # TCP fallback
    # - "50000-60000:50000-60000/udp"  # WebRTC media

  postgres:
    image: pgvector/pgvector:pg16
    container_name: myslack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       postgres          # init.sql creates slack_clone_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: myslack-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DB_HOST to point to postgres container
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/slack_clone_db
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://slack-api.akstest.win}
        EXPO_PUBLIC_WS_URL: ${EXPO_PUBLIC_WS_URL:-wss://slack-api.akstest.win/ws/chat}
    container_name: myslack-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "19007:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  pg_data:
